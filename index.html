
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <div class="logo">✦ PromptCraft AI</div>
            <p class="tagline">Create smarter prompts. Get better AI results.</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">

            <div class="intro">
                <h1>AI Prompt Generator</h1>
                <p>Build clear, powerful prompts for your AI tools in seconds.</p>
            </div>

            <!-- Prompt Form -->
            <section class="form-card">

                <div class="form-group">
                    <label for="role">🎭 Role</label>
                    <input type="text" id="role"
                        placeholder="Example: Act as a data science teacher">
                </div>

                <div class="form-group">
                    <label for="task">🎯 Task</label>
                    <textarea id="task"
                        placeholder="What do you want the AI to do?"
                        rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="context">📚 Context</label>
                    <textarea id="context"
                        placeholder="Provide background information..."
                        rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="constraints">⚙️ Constraints</label>
                    <textarea id="constraints"
                        placeholder="Add rules, limitations, or requirements..."
                        rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="format">📄 Output Format</label>
                    <input type="text" id="format"
                        placeholder="Example: Bullet points, table, paragraph">
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button id="generateBtn" class="generate-btn">
                        ✨ Generate Prompt
                    </button>

                    <button id="sampleBtn" class="sample-btn">
                        💡 Sample
                    </button>

                    <button id="clearBtn" class="clear-btn">
                        🗑 Clear
                    </button>
                </div>

            </section>

            <!-- Output Section -->
            <section class="output-card">

                <div class="output-header">
                    <h2>Generated Prompt</h2>
                    <button id="copyBtn" class="copy-btn">
                        📋 Copy Prompt
                    </button>
                </div>

                <div id="output" class="output-box">
                    <p class="placeholder">
                        Your generated prompt will appear here...
                    </p>
                </div>

            </section>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Made with 💜 for students | AI Prompt Generator</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
